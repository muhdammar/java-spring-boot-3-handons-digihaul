spring.application.name=java-spring-boot-3-handons-digihaul

# Oracle Connection Settings
# Port 1521 is standard for Oracle; /XEPDB1 is the Pluggable Database in 21c XE
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=Oracle2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate Settings
# Use 'update' instead of 'create-drop' once your table structure is stable
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Explicitly tell Hibernate to use the Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect